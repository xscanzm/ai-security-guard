name: guard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 单元测试
        run: python -m unittest discover -s tests -v
      - name: 自检（不能有严重/高危）
        run: python scripts/guard.py scan . --no-cache --fail-on high
      - name: 演示项目（必须抓到严重问题）
        run: |
          python scripts/guard.py scan examples/vulnerable-demo --no-cache --format json --output demo.json || true
          python - <<'PY'
          import json
          with open("demo.json", encoding="utf-8") as f:
              data = json.load(f)
          critical = [x for x in data["findings"] if x["severity"] == "critical"]
          assert len(critical) >= 8, f"expected >=8 critical, got {len(critical)}"
          print(f"demo critical findings: {len(critical)}")
          PY
